<style>
/* --- GLOBAL LIGHT MODE FIX --- */
/* Because this is in navbar.html, it now applies to ALL 13 pages! */

    --card: rgba(241, 245, 249, 0.8);

/* --- MASTER NAVBAR STYLES --- */
/* --- FLOATING GLASS NAVIGATION (matches index.html) --- */
.nav-top {

.nav-links { display: flex; gap: 8px; align-items: center; }
.nav-item { position: relative; height: 40px; display: flex; align-items: center; }

}
.nav-link:hover { color: #fff; background: rgba(255,255,255,0.05); }

/* Active Page Glow */
.nav-item:hover .nav-link, .nav-link.active-page {

  box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.2); border: 1px solid rgba(0, 240, 255, 0.3);
}

/* Beautiful Dropdowns */
.dropdown {
  position: absolute; top: 50px; left: 50%; transform: translateX(-50%) translateY(15px) scale(0.95);
  background: rgba(10, 14, 23, 0.95); border: 1px solid rgba(0, 240, 255, 0.15);
  border-radius: 16px; min-width: 220px; padding: 12px;
  opacity: 0; pointer-events: none; 
  box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 20px rgba(36, 98, 205, 0.2);
  backdrop-filter: blur(25px); transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
body.light-mode .dropdown { background: rgba(255,255,255,0.95); border-color: rgba(0,0,0,0.1); box-shadow: 0 15px 40px rgba(0,0,0,0.1); }
.dropdown::before { content: ""; position: absolute; top: -20px; left: 0; width: 100%; height: 20px; }
.nav-item:hover .dropdown { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0) scale(1); }

.drop-link { 
  display: flex; flex-direction: column; padding: 12px 16px; color: #94a3b8; 
  text-decoration: none; font-size: 0.85rem; font-weight: 700; 
  border-radius: 10px; margin-bottom: 4px; transition: all 0.2s;
}
.drop-link:hover { background: rgba(36, 98, 205, 0.15); color: #fff; padding-left: 20px; border-left: 2px solid #00f0ff; }
body.light-mode .drop-link { color: #475569; }
body.light-mode .drop-link:hover { background: rgba(0,0,0,0.05); color: #000; border-left-color: var(--accent); }

/* Right Side Actions */
.nav-actions { display: flex; align-items: center; gap: 15px; flex-shrink: 0; }

.theme-toggle {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); color: #fff;
  padding: 10px 16px; border-radius: 12px; cursor: pointer; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
}
.theme-toggle:hover { background: #fff; color: #000; }

.mobile-toggle {
  display: none; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff;
  font-size: 1.5rem; cursor: pointer; width: 40px; height: 40px; border-radius: 8px;
}
body.light-mode .mobile-toggle { color: #000; background: rgba(0,0,0,0.1); border-color: rgba(0,0,0,0.2); }

/* --- MOBILE RESPONSIVENESS (matches index.html) --- */
@media screen and (max-width: 768px) {
    .nav-top { 
        padding: 0 20px; 
        width: calc(100% - 40px);
        top: 0; 
        border-radius: 0; 
        border-left: none; 
        border-right: none; 
        border-top: none; 
    }
    .mobile-toggle { 
        display: flex; 
        align-items: center; 
        justify-content: center; 
    }
    .nav-links {
        position: fixed; top: 70px; left: -100%; width: 100%; height: calc(100vh - 70px);
        background: rgba(3, 4, 7, 0.98); flex-direction: column; padding: 40px; gap: 15px;
        transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); overflow-y: auto; align-items: flex-start;
        border-top: 1px solid rgba(255,255,255,0.06); z-index: 4999;
    }
    .nav-links.active { left: 0; }
    .nav-item { height: auto; width: 100%; flex-direction: column; align-items: flex-start; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 15px; }
    .nav-link { font-size: 0.9rem; padding: 10px 0; width: 100%; }
    .dropdown { 
        position: static; transform: none; opacity: 1; pointer-events: auto; 
        box-shadow: none; border: none; background: transparent; 
        padding: 10px 0 0 15px; display: none; width: 100%;
    }
    .nav-item.active .dropdown { display: block; }
    .drop-link { padding: 10px 0; font-size: 0.85rem; }
    
    /* Fix nav-actions layout in mobile - burger rightmost */
    .nav-actions {
        flex-direction: row-reverse;
        width: auto;
        justify-content: flex-end;
    }
    #userMenu {
        position: fixed !important;
        top: 70px !important;
        right: 20px !important;
        left: auto !important;
        width: 280px;
        z-index: 9999;
    }
}

@media (max-width: 480px) {
    .nav-logo { 
        font-size: 1.2rem; 
    }
    .nav-links.active {
        width: calc(100% - 40px);
        right: 20px;
        left: 20px;
        top: 75px;
    }
    #userMenu {
        width: calc(100% - 40px);
        right: 20px !important;
        left: 20px !important;
    }
}
