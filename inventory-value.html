<!DOCTYPE html>
<!-- Inventory Value Calculator - Updated -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Value Calculator | Jailbreak Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #0a0e27;
            --surface: #1e293b;
            --card: #1e1f2e;
            --border: rgba(255, 255, 255, 0.1);
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --green: #10b981;
            --red: #ef4444;
            --orange: #f59e0b;
            --purple: #8b5cf6;
            --text-main: #ffffff;
            --text-dim: #94a3b8;
        }
        
        body.light-mode {
            --bg: #f8fafc;
            --surface: #ffffff;
            --card: #f1f5f9;
            --border: rgba(0, 0, 0, 0.1);
            --accent: #005bb5;
            --text-main: #0f172a;
            --text-dim: #475569;
        }
        
        * { box-sizing: border-box; transition: all 0.3s ease; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--text-main); 
            margin: 0; 
            padding-top: 80px;
            min-height: 100vh;
        }
        
        .hero-section {
            text-align: center;
            padding: 100px 40px 60px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(59, 130, 246, 0.05) 100%);
            border-radius: 32px;
            margin: 0 40px 60px;
        }
        
        .hero-title {
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--text-main), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .hero-subtitle {
            font-size: 1.25rem;
            color: var(--text-dim);
            max-width: 700px;
            margin: 0 auto;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px 80px;
        }
        
        /* Total Value Display */
        .total-value-card {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(139, 92, 246, 0.2));
            border: 2px solid var(--accent);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }
        
        .total-value-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 70%);
            animation: pulse 4s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        
        .total-label {
            font-size: 1rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }
        
        .total-amount {
            font-family: 'JetBrains Mono', monospace;
            font-size: 4rem;
            font-weight: 800;
            color: var(--text-main);
            position: relative;
            z-index: 1;
        }
        
        .total-amount small {
            font-size: 1.5rem;
            color: var(--accent);
        }
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
        }
        
        .stat-box-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
        }
        
        .stat-box-label {
            font-size: 0.875rem;
            color: var(--text-dim);
            margin-top: 8px;
        }
        
        /* Search Section */
        .search-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .search-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .search-title {
            font-size: 1.5rem;
            font-weight: 700;
        }
        
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }
        
        .search-input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            font-family: inherit;
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        
        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
        }
        
        .search-results {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--bg);
        }
        
        .search-result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .search-result-item:hover {
            background: rgba(59, 130, 246, 0.1);
        }
        
        .search-result-item:last-child {
            border-bottom: none;
        }
        
        .item-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .item-icon {
            width: 40px;
            height: 40px;
            background: var(--surface);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
        }
        
        .item-details h4 {
            margin: 0;
            font-size: 1rem;
        }
        
        .item-details span {
            font-size: 0.875rem;
            color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
        }
        
        .add-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .add-btn:hover {
            background: #2563eb;
        }
        
        /* Inventory List */
        .inventory-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
        }
        
        .inventory-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .inventory-title {
            font-size: 1.5rem;
            font-weight: 700;
        }
        
        .clear-btn {
            background: rgba(239, 68, 68, 0.1);
            color: var(--red);
            border: 1px solid var(--red);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .clear-btn:hover {
            background: var(--red);
            color: white;
        }
        
        .inventory-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .inventory-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .inventory-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }
        
        .item-main {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .item-quantity-badge {
            background: var(--accent);
            color: white;
            min-width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.875rem;
        }
        
        .item-quantity-badge.multiple {
            background: var(--green);
        }
        
        .item-name-value {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .item-name {
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        .item-value {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
            font-weight: 600;
        }
        
        .item-total {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }
        
        .item-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .qty-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        
        .qty-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
        }
        
        .remove-btn {
            background: rgba(239, 68, 68, 0.1);
            color: var(--red);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .remove-btn:hover {
            background: var(--red);
            color: white;
        }
        
        .empty-inventory {
            text-align: center;
            padding: 80px 40px;
            color: var(--text-dim);
        }
        
        .empty-inventory i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        @media (max-width: 768px) {
            .hero-title { font-size: 2.5rem; }
            .stats-row { grid-template-columns: 1fr; }
            .total-amount { font-size: 2.5rem; }
            .container { padding: 0 20px 40px; }
            .inventory-item { flex-direction: column; gap: 16px; }
            .item-controls { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    
    <div class="hero-section">
        <h1 class="hero-title">Inventory Value Calculator</h1>
        <p class="hero-subtitle">Add your items and see your total account value. Track multiple quantities easily.</p>
    </div>
    
    <div class="container">
        <!-- Total Value Card -->
        <div class="total-value-card">
            <div class="total-label">Total Account Value</div>
            <div class="total-amount" id="totalValue">
                <small>$</small>0
            </div>
        </div>
        
        <!-- Stats -->
        <div class="stats-row">
            <div class="stat-box">
                <div class="stat-box-value" id="totalItems">0</div>
                <div class="stat-box-label">Total Items</div>
            </div>
            <div class="stat-box">
                <div class="stat-box-value" id="uniqueItems">0</div>
                <div class="stat-box-label">Unique Items</div>
            </div>
            <div class="stat-box">
                <div class="stat-box-value" id="multipleItems">0</div>
                <div class="stat-box-label">Multiples (2+)</div>
            </div>
        </div>
        
        <!-- Search Section -->
        <div class="search-section">
            <div class="search-header">
                <h3 class="search-title"><i class="fas fa-search"></i> Add Items</h3>
            </div>
            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="search-input" id="searchInput" placeholder="Search for items (e.g., 'Brulee', 'HyperChrome', 'Torpedo')...">
            </div>
            <div class="search-results" id="searchResults" style="display: none;"></div>
        </div>
        
        <!-- Inventory List -->
        <div class="inventory-section">
            <div class="inventory-header">
                <h3 class="inventory-title"><i class="fas fa-box-open"></i> Your Inventory</h3>
                <button class="clear-btn" onclick="clearInventory()">
                    <i class="fas fa-trash"></i> Clear All
                </button>
            </div>
            <div class="inventory-list" id="inventoryList">
                <div class="empty-inventory">
                    <i class="fas fa-box"></i>
                    <p>No items added yet. Search above to add items to your inventory.</p>
                </div>
            </div>
        </div>
    </div>
    
    <div id="footer-container"></div>
    
    <script>
        let allItems = [];
        let inventory = JSON.parse(localStorage.getItem('inventoryValue') || '[]');
        
        // Fetch items from API via server proxy (bypasses CORS)
        async function fetchItems() {
            try {
                const response = await fetch('/api/jbvalues-items');
                const data = await response.json();
                
                // Convert API data to simple format
                allItems = data.map(item => ({
                    name: item.displayName || item.name,
                    value: item.value || 0
                })).filter(item => item.name);
                
                console.log('Loaded', allItems.length, 'items');
            } catch (error) {
                console.error('Error fetching items:', error);
                allItems = [];
            }
        }
        
        // Format value for display
        function formatValue(value) {
            if (!value) return '0';
            const num = parseFloat(value);
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }
        
        // Parse value to number
        function parseValue(value) {
            if (!value) return 0;
            const str = value.toString().toUpperCase();
            let num = parseFloat(str.replace(/[^0-9.]/g, ''));
            if (str.includes('M')) num *= 1000000;
            else if (str.includes('K')) num *= 1000;
            return num;
        }
        
        // Search functionality
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const resultsDiv = document.getElementById('searchResults');
            
            if (query.length < 2) {
                resultsDiv.style.display = 'none';
                return;
            }
            
            const matches = allItems.filter(item => 
                item.name && item.name.toLowerCase().includes(query)
            ).slice(0, 10);
            
            if (matches.length === 0) {
                resultsDiv.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-dim);">No items found</div>';
            } else {
                resultsDiv.innerHTML = matches.map(item => `
                    <div class="search-result-item" onclick="addItem('${item.name.replace(/'/g, "\\'")}', '${item.value}')">
                        <div class="item-info">
                            <div class="item-icon"><i class="fas fa-car"></i></div>
                            <div class="item-details">
                                <h4>${item.name}</h4>
                                <span>$${formatValue(item.value)}</span>
                            </div>
                        </div>
                        <button class="add-btn"><i class="fas fa-plus"></i> Add</button>
                    </div>
                `).join('');
            }
            
            resultsDiv.style.display = 'block';
        });
        
        // Add item to inventory
        function addItem(name, value) {
            const existing = inventory.find(item => item.name === name);
            
            if (existing) {
                existing.quantity += 1;
            } else {
                inventory.push({
                    name: name,
                    value: value,
                    quantity: 1
                });
            }
            
            saveInventory();
            renderInventory();
            
            // Clear search
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').style.display = 'none';
        }
        
        // Remove item
        function removeItem(index) {
            inventory.splice(index, 1);
            saveInventory();
            renderInventory();
        }
        
        // Update quantity
        function updateQuantity(index, delta) {
            inventory[index].quantity += delta;
            
            if (inventory[index].quantity <= 0) {
                removeItem(index);
                return;
            }
            
            saveInventory();
            renderInventory();
        }
        
        // Clear all
        function clearInventory() {
            if (confirm('Are you sure you want to clear all items?')) {
                inventory = [];
                saveInventory();
                renderInventory();
            }
        }
        
        // Toggle between clean and dupe
        function toggleItemType(index) {
            const item = inventory[index];
            item.isDuped = !item.isDuped;
            
            // Calculate duped value if not set (60% of clean value)
            if (item.isDuped && !item.dupedValue) {
                item.dupedValue = Math.round(parseValue(item.value) * 0.6);
            }
            
            saveInventory();
            renderInventory();
        }
        
        // Save to localStorage
        function saveInventory() {
            localStorage.setItem('inventoryValue', JSON.stringify(inventory));
        }
        
        // Render inventory
        function renderInventory() {
            const list = document.getElementById('inventoryList');
            
            if (inventory.length === 0) {
                list.innerHTML = `
                    <div class="empty-inventory">
                        <i class="fas fa-box"></i>
                        <p>No items added yet. Search above to add items to your inventory.</p>
                    </div>
                `;
                updateStats();
                return;
            }
            
            list.innerHTML = inventory.map((item, index) => {
                const itemValue = item.isDuped ? (item.dupedValue || item.value * 0.6) : item.value;
                const itemTotal = parseValue(itemValue) * item.quantity;
                const isMultiple = item.quantity > 1;
                const dupedValue = item.dupedValue || Math.round(item.value * 0.6);
                
                return `
                    <div class="inventory-item">
                        <div class="item-main">
                            <div class="item-quantity-badge ${isMultiple ? 'multiple' : ''}">${item.quantity}</div>
                            <div class="item-name-value">
                                <div class="item-name">${item.name} ${item.isDuped ? '<span style="color: var(--orange); font-size: 0.8rem;">(Dupe)</span>' : ''}</div>
                                <div class="item-value">
                                    <button class="value-toggle" onclick="toggleItemType(${index})" style="background: ${item.isDuped ? 'var(--orange)' : 'var(--green)'}; color: white; border: none; padding: 4px 12px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; margin-right: 8px;">
                                        ${item.isDuped ? 'Dupe' : 'Clean'}
                                    </button>
                                    $${formatValue(itemValue)} each
                                </div>
                            </div>
                        </div>
                        <div class="item-total">$${formatValue(itemTotal)}</div>
                        <div class="item-controls">
                            <button class="qty-btn" onclick="updateQuantity(${index}, 1)"><i class="fas fa-plus"></i></button>
                            <span style="font-weight: 700; min-width: 30px; text-align: center;">${item.quantity}</span>
                            <button class="qty-btn" onclick="updateQuantity(${index}, -1)"><i class="fas fa-minus"></i></button>
                            <button class="remove-btn" onclick="removeItem(${index})"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
            }).join('');
            
            updateStats();
        }
        
        // Update statistics
        function updateStats() {
            const totalItems = inventory.reduce((sum, item) => sum + item.quantity, 0);
            const uniqueItems = inventory.length;
            const multipleItems = inventory.filter(item => item.quantity > 1).length;
            const dupedItems = inventory.filter(item => item.isDuped).length;
            
            const totalValue = inventory.reduce((sum, item) => {
                const itemValue = item.isDuped ? (item.dupedValue || parseValue(item.value) * 0.6) : item.value;
                return sum + (parseValue(itemValue) * item.quantity);
            }, 0);
            
            document.getElementById('totalItems').textContent = totalItems;
            document.getElementById('uniqueItems').textContent = uniqueItems;
            document.getElementById('multipleItems').textContent = multipleItems;
            
            // Update label to show if there are dupes
            const label = document.querySelector('.stat-box:nth-child(3) .stat-box-label');
            if (label && dupedItems > 0) {
                label.textContent = `${dupedItems} Dupe${dupedItems > 1 ? 's' : ''}`;
            } else if (label) {
                label.textContent = 'Multiples (2+)';
            }
            
            // Animate total value
            const totalValueEl = document.getElementById('totalValue');
            totalValueEl.innerHTML = `<small>$</small>${formatValue(totalValue)}`;
        }
        
        // Close search when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-section')) {
                document.getElementById('searchResults').style.display = 'none';
            }
        });
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            fetchItems();
            renderInventory();
        });
    </script>
    <script src="auth-guard.js"></script>
    <script src="loader.js"></script>
</body>
</html>
