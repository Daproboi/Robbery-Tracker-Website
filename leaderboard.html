<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard | Jailbreak Hub</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4156751217830729" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #030407;
            --surface: rgba(10, 12, 16, 0.7);
            --card: rgba(17, 20, 26, 0.6);
            --card-hover: rgba(30, 35, 45, 0.8);
            --border: rgba(255, 255, 255, 0.06);
            --accent: #0070f3;
            --accent-glow: rgba(0, 112, 243, 0.5);
            --jailbreak-green: #00ff88;
            --green-glow: rgba(0, 255, 136, 0.4);
            --orange: #f59e0b;
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --text-muted: #64748b;
        }
        
        body.light-mode {
            --bg: #f8fafc;
            --surface: rgba(255, 255, 255, 0.8);
            --card: rgba(241, 245, 249, 0.8);
            --card-hover: rgba(255, 255, 255, 0.95);
            --border: rgba(0, 0, 0, 0.08);
            --accent: #005bb5;
            --text-main: #0f172a;
            --text-dim: #475569;
            --text-muted: #94a3b8;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            padding-top: 100px;
            padding-bottom: 40px;
        }
        
        /* Premium Ambient Background */
        body::before {
            content: '';
            position: fixed;
            top: -20%;
            left: -10%;
            width: 60vw;
            height: 60vh;
            background: radial-gradient(circle, rgba(0, 112, 243, 0.08) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -10%;
            right: -10%;
            width: 50vw;
            height: 50vh;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.05) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* Header */
        .leaderboard-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .leaderboard-header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--jailbreak-green) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .leaderboard-header p {
            color: var(--text-dim);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto 20px;
        }
        
        /* Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        
        .stat-box i {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: var(--accent);
        }
        
        .stat-box .stat-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
        }
        
        .stat-box .stat-label {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-top: 4px;
        }
        
        /* Top 3 Podium */
        .podium {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 20px;
            align-items: end;
            max-width: 700px;
            margin: 0 auto 40px;
        }
        
        .podium-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            position: relative;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
        }
        
        .podium-item:hover {
            transform: translateY(-5px);
        }
        
        .podium-item.first {
            padding-top: 40px;
            background: linear-gradient(180deg, rgba(255, 215, 0, 0.25) 0%, rgba(255, 215, 0, 0.08) 100%);
            border: 3px solid #ffd700;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.4), inset 0 0 30px rgba(255, 215, 0, 0.15);
            transform: scale(1.1);
            z-index: 3;
        }
        
        .podium-item.second {
            background: linear-gradient(180deg, rgba(192, 192, 192, 0.2) 0%, rgba(192, 192, 192, 0.05) 100%);
            border: 2px solid #e8e8e8;
            box-shadow: 0 0 30px rgba(192, 192, 192, 0.25);
            opacity: 0.95;
        }
        
        .podium-item.third {
            background: linear-gradient(180deg, rgba(205, 127, 50, 0.2) 0%, rgba(205, 127, 50, 0.05) 100%);
            border: 2px solid #b87333;
            box-shadow: 0 0 30px rgba(205, 127, 50, 0.25);
            opacity: 0.9;
        }
        
        .rank-badge {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.2rem;
            color: #000;
        }
        
        .first .rank-badge { background: #ffd700; color: #000; box-shadow: 0 0 15px rgba(255, 215, 0, 0.6); }
        .second .rank-badge { background: #e8e8e8; color: #000; }
        .third .rank-badge { background: #b87333; color: #fff; }
        
        .podium-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid;
            margin-bottom: 10px;
        }
        
        .first .podium-avatar { border-color: var(--gold); width: 70px; height: 70px; }
        .second .podium-avatar { border-color: var(--silver); }
        .third .podium-avatar { border-color: var(--bronze); }
        
        .podium-name {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .podium-value {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--jailbreak-green);
        }
        
        /* Leaderboard List */
        .leaderboard-list {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        
        .list-header {
            display: grid;
            grid-template-columns: 60px 1fr 100px;
            gap: 15px;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--border);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
        }
        
        .list-row {
            display: grid;
            grid-template-columns: 60px 1fr 100px;
            gap: 15px;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            align-items: center;
            transition: background 0.2s ease;
        }
        
        .list-row:hover {
            background: var(--card-hover);
        }
        
        .list-row:last-child {
            border-bottom: none;
        }
        
        .rank-number {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--text-dim);
            text-align: center;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border);
        }
        
        .user-name {
            font-weight: 700;
            font-size: 0.95rem;
        }
        
        .items-count {
            font-size: 0.9rem;
            color: var(--text-dim);
            text-align: center;
        }
        
        .total-value {
            font-weight: 800;
            font-size: 1rem;
            color: var(--jailbreak-green);
            text-align: right;
        }
        
        /* Submit Section */
        .submit-section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            margin-top: 30px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        
        .submit-section h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }
        
        .submit-section p {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        
        .submit-btn {
            background: linear-gradient(135deg, var(--accent) 0%, var(--jailbreak-green) 100%);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 112, 243, 0.4);
        }
        
        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Loading & Error States */
        .loading-state, .error-state, .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
        }
        
        .loading-state i, .error-state i {
            font-size: 3rem;
            margin-bottom: 20px;
            display: block;
        }
        
        .loading-state i {
            animation: spin 1s linear infinite;
            color: var(--accent);
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .leaderboard-header h1 {
                font-size: 1.8rem;
            }
            
            .podium {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .podium-item.first,
            .podium-item.second,
            .podium-item.third {
                width: 90%;
                max-width: 300px;
                margin: 0 auto;
            }
            
            .podium-item.first { order: 1; }
            .podium-item.second { order: 2; }
            .podium-item.third { order: 3; }
            
            .stats-bar {
                grid-template-columns: 1fr;
            }
            
            .list-header {
                display: none;
            }
            
            .list-row {
                grid-template-columns: 50px 1fr auto;
                gap: 10px;
            }
            
            .items-count {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    
    <div class="container">
        <div class="leaderboard-header">
            <h1><i class="fas fa-trophy"></i> Richest Players</h1>
            <p>Top 250 richest Jailbreak players tracked by Muffin Hook</p>
        </div>
        
        <div class="stats-bar">
            <div class="stat-box">
                <i class="fas fa-users"></i>
                <div class="stat-value" id="totalPlayers">-</div>
                <div class="stat-label">Total Players</div>
            </div>
            <div class="stat-box">
                <i class="fas fa-gem"></i>
                <div class="stat-value" id="totalValue">-</div>
                <div class="stat-label">Combined Value</div>
            </div>
            <div class="stat-box">
                <i class="fas fa-crown"></i>
                <div class="stat-value" id="topValue">-</div>
                <div class="stat-label">Top Player Value</div>
            </div>
        </div>
        
        <div id="podium" class="podium"></div>
        
        <div class="leaderboard-list">
            <div class="list-header">
                <span>Rank</span>
                <span>Player</span>
                <span>Value</span>
            </div>
            <div id="leaderboardList"></div>
        </div>
    </div>
    
    <div id="footer-container"></div>
    
    <script>
        let leaderboardData = [];
        let currentUser = null;
        
        // Format value for display
        function formatValue(value) {
            if (!value) return '$0';
            const num = parseFloat(value);
            if (num >= 1000000000) return '$' + (num / 1000000000).toFixed(2) + 'B';
            if (num >= 1000000) return '$' + (num / 1000000).toFixed(2) + 'M';
            if (num >= 1000) return '$' + (num / 1000).toFixed(1) + 'K';
            return '$' + num.toLocaleString();
        }
        
        // Load navbar and footer
        async function loadComponents() {
            try {
                const navResponse = await fetch('navbar.html');
                const navHtml = await navResponse.text();
                document.getElementById('navbar-container').innerHTML = navHtml;
                
                const footResponse = await fetch('footer.html');
                const footHtml = await footResponse.text();
                document.getElementById('footer-container').innerHTML = footHtml;
                
                // Highlight current page
                document.querySelectorAll('.drop-link').forEach(link => {
                    if (link.href.includes('leaderboard')) {
                        link.style.background = 'rgba(36, 98, 205, 0.15)';
                        link.style.color = '#fff';
                        link.style.borderLeft = '2px solid #00f0ff';
                    }
                });
            } catch (error) {
                console.error('Error loading components:', error);
            }
        }
        
        // Fetch leaderboard data from Muffin Hook
        async function fetchLeaderboard() {
            try {
                const response = await fetch('/api/muffinhook-leaderboard');
                const data = await response.json();
                
                // Transform Muffin Hook data to our format
                leaderboardData = (data.leaderboard || []).map(player => ({
                    rank: player.rank,
                    username: player.username,
                    totalValue: player.money,
                    userId: player.UserId,
                    avatar: player.UserId ? `https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${player.UserId}&size=150x150&format=Png` : null
                }));
                
                updateStats({
                    totalPlayers: data.count || 0,
                    combinedValue: (data.leaderboard || []).reduce((sum, p) => sum + (p.money || 0), 0),
                    topValue: data.leaderboard && data.leaderboard[0] ? data.leaderboard[0].money : 0,
                    lastUpdated: data.lastUpdated
                });
                renderPodium();
                renderList();
            } catch (error) {
                console.error('Error fetching leaderboard:', error);
                document.getElementById('leaderboardList').innerHTML = `
                    <div class="error-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Failed to load leaderboard. Please try again later.</p>
                    </div>
                `;
            }
        }
        
        // Render podium (top 3)
        function renderPodium() {
            const podium = document.getElementById('podium');
            const top3 = leaderboardData.slice(0, 3);
            
            if (top3.length === 0) {
                podium.innerHTML = '<p style="color: var(--text-dim);">No entries yet. Be the first!</p>';
                return;
            }
            
            const positions = ['second', 'first', 'third'];
            const displayOrder = [1, 0, 2]; // First in middle (index 1), Second on left (index 0), Third on right (index 2)
            
            podium.innerHTML = displayOrder.map((playerIndex) => {
                const player = top3[playerIndex];
                const position = positions[playerIndex];
                // Use direct Roblox thumbnail URL
                const avatarUrl = player.userId ? 
                    `https://www.roblox.com/Thumbs/Avatar.ashx?x=150&y=150&Format=Png&userid=${player.userId}` :
                    'https://cdn.discordapp.com/embed/avatars/0.png';
                return `
                    <div class="podium-item ${position}">
                        <div class="rank-badge">${player.rank}</div>
                        <img src="${avatarUrl}" 
                             alt="${player.username}" class="podium-avatar"
                             onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
                        <div class="podium-name">${player.username}</div>
                        <div class="podium-value">${formatValue(player.totalValue)}</div>
                    </div>
                `;
            }).join('');
        }
        
        // Render leaderboard list (4th place and beyond)
        function renderList() {
            const list = document.getElementById('leaderboardList');
            const rest = leaderboardData.slice(3);
            
            if (rest.length === 0 && leaderboardData.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-clipboard-list" style="font-size: 3rem; margin-bottom: 15px; display: block; color: var(--text-dim);"></i>
                        <p>No entries yet. Be the first to submit your inventory!</p>
                    </div>
                `;
                return;
            }
            
            list.innerHTML = rest.map((player) => {
                const rank = player.rank;
                // Use direct Roblox thumbnail URL
                const avatarUrl = player.userId ? 
                    `https://www.roblox.com/Thumbs/Avatar.ashx?x=150&y=150&Format=Png&userid=${player.userId}` :
                    'https://cdn.discordapp.com/embed/avatars/0.png';
                return `
                    <div class="list-row">
                        <div class="rank-number">#${rank}</div>
                        <div class="user-info">
                            <img src="${avatarUrl}" 
                                 alt="${player.username}" class="user-avatar"
                                 onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
                            <span class="user-name">${player.username}</span>
                        </div>
                        <div class="total-value">${formatValue(player.totalValue)}</div>
                    </div>
                `;
            }).join('');
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadComponents();
            fetchLeaderboard();
            
            // Auto-refresh every 5 minutes
            setInterval(fetchLeaderboard, 5 * 60 * 1000);
        });
    </script>
    <script src="auth-guard.js"></script>
    <script src="loader.js"></script>
</body>
</html>
