<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jailbreak Hub | Login</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4156751217830729" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg: #0a0e27;
            --surface: #1e293b;
            --card: #1e1f2e;
            --border: rgba(255, 255, 255, 0.1);
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --green: #10b981;
            --red: #ef4444;
        }
        
        * {
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 60px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .login-header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--text-main), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }
        
        .login-header p {
            color: var(--text-dim);
            font-size: 1.1rem;
        }
        
        .discord-login-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
            text-decoration: none;
        }
        
        .discord-login-btn:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
        }
        
        .divider {
            text-align: center;
            color: var(--text-dim);
            margin: 30px 0;
            font-size: 0.9rem;
        }
        
        .back-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
            color: var(--accent);
        }
        
        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--red);
            color: var(--text-main);
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Jailbreak <span style="color: var(--accent);">Hub</span></h1>
            <p>Access exclusive features and tools</p>
        </div>
        
        <button class="discord-login-btn" onclick="loginWithDiscord()">
            <i class="fab fa-discord"></i>
            <span>Login with Discord</span>
        </button>
        
        <div class="divider">OR</div>
        
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i>
            Back to Home
        </a>
        
        <div class="loading" id="loading">
            <i class="fas fa-spinner fa-spin"></i>
            Authenticating...
        </div>
        
        <div class="error" id="error" style="display: none;">
            <i class="fas fa-exclamation-triangle"></i>
            <span id="error-message"></span>
        </div>
    </div>
    
    <script>
        // Discord OAuth Configuration
        const CLIENT_ID = '1487705589210550282';
        const REDIRECT_URI = encodeURIComponent(window.location.origin + '/auth/callback');
        const SCOPE = 'identify%20email%20guilds';
        
        // Mock user database (in real implementation, this would be server-side)
        const ADMINS = ['1487705589210550282', 'plugtm']; // Discord user IDs of admins
        
        function loginWithDiscord() {
            const authUrl = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${REDIRECT_URI}&response_type=code&scope=${SCOPE}`;
            window.location.href = authUrl;
        }
        
        // Handle OAuth callback
        function handleAuthCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            
            if (code) {
                document.getElementById('loading').style.display = 'block';
                
                // Exchange code for access token
                fetch('https://discord.com/api/oauth2/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        client_id: CLIENT_ID,
                        client_secret: 'YOUR_CLIENT_SECRET', // You'll need to replace this
                        grant_type: 'authorization_code',
                        code: code,
                        redirect_uri: window.location.origin + '/auth/callback',
                        scope: SCOPE,
                    }),
                })
                .then(response => response.json())
                .then(data => {
                    if (data.access_token) {
                        // Get user info
                        return fetch('https://discord.com/api/users/@me', {
                            headers: {
                                'Authorization': `Bearer ${data.access_token}`,
                            },
                        });
                    }
                })
                .then(response => response.json())
                .then(user => {
                    if (user.id) {
                        // Check if user is admin
                        const isAdmin = ADMINS.includes(user.id);
                        
                        // Store user session
                        localStorage.setItem('user', JSON.stringify({
                            id: user.id,
                            username: user.username,
                            discriminator: user.discriminator,
                            avatar: user.avatar,
                            isAdmin: isAdmin,
                            loginTime: new Date().toISOString()
                        }));
                        
                        // Redirect based on user role
                        if (isAdmin) {
                            window.location.href = '/admin.html';
                        } else {
                            window.location.href = '/index.html';
                        }
                    }
                })
                .catch(error => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('error').style.display = 'block';
                    document.getElementById('error-message').textContent = 'Authentication failed. Please try again.';
                });
            }
        }
        
        // Check if user is already logged in
        function checkLoginStatus() {
            const user = localStorage.getItem('user');
            if (user) {
                const userData = JSON.parse(user);
                // Redirect based on stored user role
                if (userData.isAdmin) {
                    window.location.href = '/admin.html';
                } else {
                    window.location.href = '/index.html';
                }
            } else {
                // Show login page
                document.querySelector('.login-container').style.display = 'block';
            }
        }
        
        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            // Check if this is auth callback
            if (window.location.pathname === '/auth/callback') {
                handleAuthCallback();
            } else {
                checkLoginStatus();
            }
        });
    </script>
</body>
</html>
