<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jailbreak Hub | Admin Panel</title>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        // Handle Discord session token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const sessionToken = urlParams.get('session');
        if (sessionToken) {
          localStorage.setItem('sessionToken', sessionToken);
          // Remove token from URL for security
          window.history.replaceState({}, document.title, window.location.pathname);
        }
      });
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4156751217830729" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg: #0a0e27;
            --surface: #1e293b;
            --card: #1e1f2e;
            --border: rgba(255, 255, 255, 0.1);
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --green: #10b981;
            --red: #ef4444;
        }
        
        * {
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        
        .admin-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .admin-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--accent);
        }
        
        .user-details {
            text-align: left;
        }
        
        .user-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 5px;
        }
        
        .user-role {
            font-size: 0.9rem;
            color: var(--accent);
            font-weight: 500;
        }
        
        .logout-btn {
            background: var(--red);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .logout-btn:hover {
            background: #dc2626;
            transform: translateY(-1px);
        }
        
        .admin-content {
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 10px;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: var(--text-dim);
        }
        
        .users-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 20px;
        }
        
        .users-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .users-table th,
        .users-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        
        .users-table th {
            background: var(--card);
            font-weight: 600;
            color: var(--accent);
        }
        
        .admin-badge {
            background: var(--accent);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .regular-badge {
            background: var(--text-dim);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="admin-header">
        <h1 class="admin-title">Admin Panel</h1>
        <div class="user-info" id="userInfo">
            <img class="user-avatar" id="userAvatar" src="" alt="Admin Avatar">
            <div class="user-details">
                <div class="user-name" id="userName">Loading...</div>
                <div class="user-role" id="userRole">Administrator</div>
            </div>
        </div>
        <button class="logout-btn" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i>
            Logout
        </button>
    </div>
    
    <div class="admin-content">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalUsers">0</div>
                <div class="stat-label">Total Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="activeUsers">0</div>
                <div class="stat-label">Active Today</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="newUsers">0</div>
                <div class="stat-label">New This Week</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalLogins">0</div>
                <div class="stat-label">Total Logins</div>
            </div>
        </div>
        
        <div class="users-section">
            <h2 class="section-title">Logged In Users</h2>
            <table class="users-table">
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Discord ID</th>
                        <th>Role</th>
                        <th>Login Time</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <!-- Users will be populated here -->
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        // Check if user is logged in and is admin
        async function checkAdminAuth() {
            const sessionToken = localStorage.getItem('sessionToken');
            
            if (!sessionToken) {
                window.location.href = '/login.html';
                return;
            }
            
            try {
                const response = await fetch(`/api/check-session?token=${sessionToken}`);
                const data = await response.json();
                
                if (!data.valid || !data.user.isAdmin) {
                    // Redirect non-admin users or invalid sessions
                    window.location.href = '/index.html';
                    return;
                }
                
                // Display user info
                document.getElementById('userAvatar').src = `https://cdn.discordapp.com/avatars/${data.user.id}.png`;
                document.getElementById('userName').textContent = data.user.username;
                document.getElementById('userRole').textContent = 'Administrator';
                
                // Load admin data
                loadAdminData();
            } catch (err) {
                console.error('Auth check failed:', err);
                window.location.href = '/login.html';
            }
        }
        
        function loadAdminData() {
            // In real implementation, this would fetch from your backend
            // For demo purposes, we'll use mock data
            
            // Mock statistics
            document.getElementById('totalUsers').textContent = '1,247';
            document.getElementById('activeUsers').textContent = '89';
            document.getElementById('newUsers').textContent = '156';
            document.getElementById('totalLogins').textContent = '15,432';
            
            // Mock users table
            const mockUsers = [
                {
                    username: 'daproboi',
                    discordId: 'daproboi_id',
                    role: 'Super Admin',
                    loginTime: '2024-03-28 10:30:00',
                    status: 'Online'
                },
                {
                    username: 'plugtm',
                    discordId: 'plugtm_id', 
                    role: 'Admin',
                    loginTime: '2024-03-28 09:15:00',
                    status: 'Online'
                },
                {
                    username: 'purpledino1780',
                    discordId: 'purpledino1780_id',
                    role: 'Member',
                    loginTime: '2024-03-28 08:45:00',
                    status: 'Online'
                }
            ];
            
            const tableBody = document.getElementById('usersTableBody');
            mockUsers.forEach(user => {
                const row = document.createElement('tr');
                
                row.innerHTML = `
                    <td>
                        <img src="https://cdn.discordapp.com/avatars/${user.discordId}.png" style="width: 30px; height: 30px; border-radius: 50%;">
                    </td>
                    <td>${user.username}</td>
                    <td>${user.discordId}</td>
                    <td>
                        <span class="admin-badge">${user.role}</span>
                    </td>
                    <td>${user.loginTime}</td>
                    <td>
                        <span class="regular-badge">${user.status}</span>
                    </td>
                `;
                
                tableBody.appendChild(row);
            });
        }
        
        function logout() {
            localStorage.removeItem('sessionToken');
            window.location.href = '/login.html';
        }
        
        // Initialize admin panel
        document.addEventListener('DOMContentLoaded', function() {
            checkAdminAuth();
        });
    </script>
</body>
</html>
