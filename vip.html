<!DOCTYPE html>  
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Jailbreak Hub | Private Servers</title>  
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">  
    
    <style>

          
        :root {  
            --bg: #030508;  
            --surface: #0a0c10;  
            --card: #11141a;  
            --border: rgba(255, 255, 255, 0.08);  
            --accent: #0070f3;  
            --accent-glow: rgba(0, 112, 243, 0.4);  
            --jailbreak-green: #00ff88;  
            --green-glow: rgba(0, 255, 136, 0.3);  
            --text-main: #ffffff;  
            --text-dim: #94a3b8;  
            --invert: 0;  
        } 
        body.light-mode {  
            --bg: #f8fafc;  
            --surface: #ffffff;  
            --card: #f1f5f9;  
            --border: rgba(0, 0, 0, 0.1);  
            --accent: #005bb5;  
            --accent-glow: rgba(0, 91, 181, 0.3);  
            --jailbreak-green: #00b35f;  
            --green-glow: rgba(0, 179, 95, 0.2);  
            --text-main: #0f172a;  
            --text-dim: #475569;  
            --invert: 1;  
        }  
        * { box-sizing: border-box; transition: background-color 0.3s, color 0.3s, border-color 0.3s; scroll-behavior: smooth; }  
        body {  
            font-family: 'Plus Jakarta Sans', sans-serif;  
            background: var(--bg); color: var(--text-main);  
            margin: 0; padding-top: 70px;  
            overflow-x: hidden; min-height: 100vh;
            display: flex;
            flex-direction: column;
        }  

        
        /* --- CONTENT AREA --- */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .dev-container {
            text-align: center;
            max-width: 600px;
            padding: 60px 40px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            position: relative;
            overflow: hidden;
        }

        .dev-container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: repeating-linear-gradient(45deg, #facc15, #facc15 10px, #000 10px, #000 20px);
        }

        .dev-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            display: inline-block;
            filter: drop-shadow(0 0 15px var(--accent-glow));
        }

        .dev-container h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0 0 15px;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .dev-container p {
            color: var(--text-dim);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .status-badge {
            background: rgba(0, 112, 243, 0.1);
            color: var(--accent);
            padding: 8px 20px;
            border-radius: 30px;
            font-family: 'JetBrains Mono';
            font-size: 0.8rem;
            font-weight: 700;
            border: 1px solid var(--accent);
            display: inline-block;
        }

        /* --- MOBILE RESPONSIVENESS --- */
        @media screen and (max-width: 768px) {
            .dev-container h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div id="navbar-container"></div>  

    <main class="main-content">
        <div class="dev-container">
            <div class="dev-icon">🚧</div>
            <h1>Under Construction</h1>
            <p>Our Private Server hub is currently being wired up. We're sourcing the fastest, low-ping VIP links to ensure your grinding sessions are never interrupted by cops.</p>
            <div class="status-badge">DEPLOYMENT STATUS: 45% COMPLETE</div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="auth-guard.js"></script>
    <script src="loader.js"></script>
</body>
</html>
