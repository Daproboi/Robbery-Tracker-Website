<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jailbreak Hub | Market Database</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbackend/js/adsbygoogle.js?client=ca-pub-4156751217830729"
     crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* --- AUTOMATIC GLOBAL LIGHT MODE FIX --- */
        body.light-mode {     
            --bg: #f8fafc !important;    
            --surface: rgba(255, 255, 255, 0.8) !important;    
            --card: rgba(241, 245, 249, 0.8) !important;    
            --card-hover: rgba(255, 255, 255, 0.95) !important;
            --border: rgba(0, 0, 0, 0.08) !important;    
            --border-light: rgba(0, 0, 0, 0.15) !important;
            --accent: #005bb5 !important;    
            --accent-glow: #005bb5 !important;    
            --green: #00b35f !important;    
            --orange: #d97706 !important;
            --red: #dc2626 !important;
            --text-main: #0f172a !important;    
            --text-dim: #475569 !important;    
            --muted: rgba(0, 0, 0, 0.05) !important;
            --muted-hover: rgba(0, 0, 0, 0.1) !important;
            --invert: 1 !important;
        }
        /* Forces hardcoded white text to flip dark when light mode is active */
        body.light-mode * { color: var(--text-main); }
        body.light-mode .text-green { color: var(--green) !important; }
        body.light-mode .text-orange { color: var(--orange) !important; }
        body.light-mode .text-red { color: var(--red) !important; }
        body.light-mode .bounty-name, body.light-mode .sb-val, body.light-mode .bounty-slider-val { color: var(--accent) !important; text-shadow: none !important; }
        /* --------------------------------------- */

        :root {
            --bg: #030508;
            --surface: #0a0c10;
            --card: #11141a;
            --border: rgba(255, 255, 255, 0.08);
            --accent: #0070f3;
            --green: #00ff88;
            --red: #ff4444;
            --orange: #ffa500;
            --text-main: #ffffff;
            --text-dim: #94a3b8;
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg); color: var(--text-main); 
            margin: 0; padding-top: 100px;
            background-image: radial-gradient(circle at 50% -20%, #111827 0%, #030508 60%);
            min-height: 100vh;
        }

        /* --- UNIFIED NAVIGATION --- */
        .nav-top {
            position: fixed; top: 0; width: 100%; height: 70px;
            background: rgba(3, 5, 8, 0.9); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border); display: flex;
            align-items: center; justify-content: center;
            padding: 0 40px; z-index: 5000;
        }
        .nav-logo { position: absolute; left: 40px; font-weight: 800; font-size: 1.4rem; text-decoration: none; color: #fff; letter-spacing: -1px; }
        .nav-logo span { color: var(--accent); }
        .nav-links { display: flex; gap: 5px; align-items: center; }
        .nav-item { position: relative; height: 70px; display: flex; align-items: center; padding: 0 12px; }
        .nav-link { text-decoration: none; color: var(--text-dim); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; }
        .nav-link:hover, .nav-item:hover .nav-link { color: #fff; }

        .dropdown {
            position: absolute; top: 70px; left: 50%; transform: translateX(-50%) translateY(10px);
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; min-width: 220px; padding: 10px;
            opacity: 0; pointer-events: none; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .nav-item:hover .dropdown { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
        
        .drop-link { 
            display: flex; flex-direction: column; padding: 12px; 
            color: var(--text-dim); text-decoration: none; 
            font-size: 0.75rem; border-radius: 8px; font-weight: 600; 
            margin-bottom: 4px;
        }
        .drop-link:hover { background: var(--card); color: #fff; }

        .mobile-toggle { display: none; }

        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        
        .search-section {
            background: var(--surface); border: 1px solid var(--border);
            padding: 30px; border-radius: 24px; margin-bottom: 40px;
        }
        .search-bar {
            width: 100%; background: #000; border: 1px solid var(--border);
            padding: 20px; border-radius: 14px; color: #fff; font-size: 1.1rem;
            outline: none; margin-bottom: 20px;
        }

        .filter-row { display: flex; flex-wrap: wrap; gap: 10px; }
        .f-btn {
            padding: 10px 20px; border-radius: 10px; background: var(--card);
            border: 1px solid var(--border); color: var(--text-dim);
            font-size: 0.75rem; font-weight: 800; text-transform: uppercase; cursor: pointer;
        }
        .f-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

        .items-grid {
            display: grid; 
            grid-template-columns: repeat(4, 1fr);
            gap: 24px; padding-bottom: 50px;
        }

        @media (max-width: 1400px) { .items-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 900px) { .items-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .items-grid { grid-template-columns: 1fr; } }

        .item-card {
            background: linear-gradient(135deg, var(--card) 0%, rgba(17, 20, 26, 0.8) 100%); 
            border: 1px solid var(--border);
            border-radius: 20px; display: flex; flex-direction: column; overflow: hidden;
            cursor: pointer; position: relative; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .item-card:hover { 
            border-color: var(--accent); 
            transform: translateY(-8px) scale(1.02); 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .img-container {
            width: 100%; height: 200px; background: linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000), linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            display: flex; align-items: center; justify-content: center;
            border-bottom: 1px solid var(--border); position: relative;
            overflow: hidden;
        }
        .img-large { width: 90%; height: 90%; object-fit: contain; transition: transform 0.3s ease; }
        .item-card:hover .img-large { transform: scale(1.1); }

        .trend-badge {
            position: absolute; top: 12px; right: 12px;
            padding: 6px 12px; border-radius: 8px; font-size: 0.6rem;
            font-weight: 900; text-transform: uppercase; border: 1px solid;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .trend-rising { 
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2) 0%, rgba(0, 255, 136, 0.1) 100%); 
            color: var(--green); 
            border-color: var(--green);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }
        .trend-falling { 
            background: linear-gradient(135deg, rgba(255, 68, 68, 0.2) 0%, rgba(255, 68, 68, 0.1) 100%); 
            color: var(--red); 
            border-color: var(--red);
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.3);
        }
        .trend-stable { 
            background: linear-gradient(135deg, rgba(148, 163, 184, 0.2) 0%, rgba(148, 163, 184, 0.1) 100%); 
            color: var(--text-dim); 
            border-color: var(--border);
        }

        .card-content { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .item-cat { 
            color: var(--accent); 
            font-size: 0.65rem; 
            font-weight: 800; 
            text-transform: uppercase; 
            margin-bottom: 6px; 
            display: block;
            letter-spacing: 0.05em;
        }
        .card-content h3 { 
            margin: 0 0 16px 0; 
            font-size: 1.1rem; 
            font-weight: 800; 
            line-height: 1.2;
            min-height: 2.4rem;
            display: flex;
            align-items: center;
        }

        .data-list { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
        .data-item {
            display: flex; justify-content: space-between;
            align-items: center;
            padding: 10px 12px; 
            background: rgba(0,0,0,0.3); 
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s ease;
        }
        .data-item:hover {
            background: rgba(0,0,0,0.5);
            transform: translateX(2px);
        }
        .d-label { 
            font-size: 0.65rem; 
            color: var(--text-dim); 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.05em;
        }
        .d-val { 
            font-family: 'JetBrains Mono'; 
            font-weight: 700; 
            font-size: 0.9rem;
            text-shadow: 0 0 10px currentColor;
        }
        
        .val-clean { 
            color: var(--green); 
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.5);
        }
        .val-duped { 
            color: var(--orange); 
            text-shadow: 0 0 8px rgba(255, 165, 0, 0.5);
        }
        .demand-indicator {
            position: absolute;
            bottom: 12px;
            left: 12px;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.55rem;
            font-weight: 700;
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.7);
            color: var(--text-dim);
            backdrop-filter: blur(5px);
        }
        .demand-high { color: var(--green); }
        .demand-medium { color: var(--orange); }
        .demand-low { color: var(--red); }
        .original-price {
            font-size: 0.6rem;
            color: var(--text-dim);
            margin-top: 4px;
            font-style: italic;
        }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(3, 5, 8, 0.95); 
            z-index: 10000; display: none; overflow-y: auto; padding: 40px 20px;
            backdrop-filter: blur(10px);
        }
        .modal-container { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(280px, 1fr) minmax(320px, 1.15fr); gap: 40px; position: relative; align-items: start; min-height: auto; }
        .modal-close { position: fixed; top: 30px; right: 40px; font-size: 2rem; cursor: pointer; color: var(--text-dim); z-index: 10001; }
        
        .modal-img-big { width: 100%; border-radius: 24px; background: #000; border: 1px solid var(--border); aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .modal-img-big img { width: 85%; object-fit: contain; }

        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }
        .detail-box { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 16px; }
        .detail-label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; font-weight: 800; margin-bottom: 8px; display: block; letter-spacing: 1px;}
        .detail-value { font-family: 'JetBrains Mono'; font-size: 1.25rem; font-weight: 700; }

        .pagination { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 50px; }
        .page-btn { background: var(--surface); border: 1px solid var(--border); color: #fff; padding: 10px 20px; border-radius: 10px; cursor: pointer; }
        .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        footer {
            background: var(--surface); border-top: 1px solid var(--border);
            padding: 60px 20px; text-align: center; margin-top: 100px;
        }
        .footer-brand { font-size: 1.5rem; font-weight: 900; margin-bottom: 10px; }
        .footer-brand span { color: var(--accent); }
        .footer-credits { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 20px; }
        .footer-links { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
        .footer-links a { color: var(--text-main); text-decoration: none; font-size: 0.85rem; font-weight: 700; }
        .footer-links a:hover { color: var(--accent); }

        @media (max-width: 900px) {
            .modal-container { grid-template-columns: 1fr; padding-top: 60px; }
            .modal-img-big { aspect-ratio: 16/10; }
        }

        .items-grid > .grid-empty {
            grid-column: 1 / -1;
            justify-self: center;
            width: 100%;
            max-width: 560px;
            text-align: center;
            padding: 3rem 1.5rem;
        }
        .loading-banner .loading-text {
            color: var(--accent);
            font-weight: 800;
            margin: 0;
            animation: values-pulse 1.2s ease-in-out infinite;
        }
        @keyframes values-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }
        .error-banner .error-title {
            color: var(--red);
            font-weight: 800;
            text-transform: uppercase;
            margin: 0 0 0.5rem;
        }
        .error-banner .error-detail {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin: 0 0 1rem;
            word-break: break-word;
        }
        .reconnect-btn {
            margin-top: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 10px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
        }
        .grid-empty.no-results .no-results-text {
            color: var(--text-dim);
            margin: 0;
            font-weight: 600;
        }
        .pagination #pageDisplay {
            color: var(--text-dim);
            font-size: 0.85rem;
            font-weight: 700;
            min-width: 8rem;
            text-align: center;
        }
        .modal-right .modal-title {
            margin: 0 0 1.25rem;
            font-size: clamp(1.5rem, 4vw, 3rem);
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            line-height: 1.1;
            word-break: break-word;
            hyphens: auto;
            color: var(--text-main);
        }
        body.light-mode .search-bar {
            background: var(--card) !important;
            color: var(--text-main) !important;
            border-color: var(--border) !important;
        }
        body.light-mode .page-btn {
            color: var(--text-main) !important;
        }

        .modal-right {
            max-height: min(88vh, 900px);
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 6px;
        }
        .modal-section-title {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-dim);
            margin: 1.75rem 0 0.75rem;
        }
        .modal-section-title:first-child {
            margin-top: 0;
        }
        .modal-desc-block {
            margin-top: 0.5rem;
        }
        .modal-desc {
            color: var(--text-dim);
            line-height: 1.6;
            margin: 0;
            font-size: 0.88rem;
        }
        .modal-api-table {
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            background: rgba(0,0,0,0.15);
        }
        .modal-api-row {
            display: grid;
            grid-template-columns: minmax(120px, 0.95fr) minmax(0, 1.25fr);
            gap: 12px 16px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            font-size: 0.72rem;
            align-items: start;
        }
        .modal-api-row:last-child { border-bottom: none; }
        .modal-api-k {
            color: var(--text-dim);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .modal-api-v {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            color: var(--text-main);
            word-break: break-word;
            white-space: pre-wrap;
        }
        body.light-mode .modal-api-table {
            background: rgba(0, 0, 0, 0.035);
        }
    </style>
</head>
<body>

    <div id="navbar-container"></div>

    <div class="container">
        <h1 class="text-3xl font-black italic uppercase mb-8">Market Database</h1>
        <div class="search-section">
            <input type="text" id="search" class="search-bar" placeholder="Search items (e.g. Torpedo, Celsior)..." oninput="resetAndRender()">
            <div class="filter-row" id="filters">
                <div class="f-btn active" id="btn-all" onclick="setCat('all', this)">All Items</div>
            </div>
        </div>

        <div class="items-grid" id="grid"></div>

        <div class="pagination">
            <button class="page-btn" id="prevBtn" onclick="changePage(-1)">Previous</button>
            <span id="pageDisplay">Page 1 of 1</span>
            <button class="page-btn" id="nextBtn" onclick="changePage(1)">Next</button>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></div>
        <div class="modal-container" id="modalContent"></div>
    </div>

    <div id="footer-container"></div>

    <script src="api.js"></script>

    <script>
        const ITEM_IMG_PLACEHOLDER = 'https://via.placeholder.com/400/0a0c10/64748b?text=%3F';

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function escapeAttr(text) {
            return String(text).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
        }

        function jbValuesImgFallback(img) {
            img.onerror = null;
            img.src = ITEM_IMG_PLACEHOLDER;
        }

        function humanizeApiKey(path) {
            return path.split('.').map(part =>
                part
                    .replace(/([a-z])([A-Z])/g, '$1 $2')
                    .replace(/_/g, ' ')
                    .replace(/\b\w/g, c => c.toUpperCase())
            ).join(' → ');
        }

        function formatScalarForApi(val) {
            if (val === null || val === undefined) return '—';
            if (typeof val === 'boolean') return val ? 'Yes' : 'No';
            if (typeof val === 'number') {
                return Number.isFinite(val) ? val.toLocaleString() : String(val);
            }
            if (typeof val === 'string') {
                if (/^\d{4}-\d{2}-\d{2}T\d{2}/.test(val)) {
                    const d = new Date(val);
                    if (!isNaN(d.getTime())) return d.toLocaleString();
                }
                return val;
            }
            if (Array.isArray(val)) {
                if (!val.length) return '—';
                if (val.some(x => x !== null && typeof x === 'object'))
                    return JSON.stringify(val);
                return val.map(x => formatScalarForApi(x)).join(', ');
            }
            return JSON.stringify(val);
        }

        function flattenApiObject(obj, prefix) {
            const rows = [];
            if (obj === null || obj === undefined) return rows;
            if (Array.isArray(obj)) {
                rows.push({
                    path: prefix || 'value',
                    label: humanizeApiKey(prefix || 'Value'),
                    value: formatScalarForApi(obj)
                });
                return rows;
            }
            if (typeof obj !== 'object') return rows;
            for (const [k, v] of Object.entries(obj)) {
                if (k === '__v') continue;
                const path = prefix ? prefix + '.' + k : k;
                if (v !== null && typeof v === 'object' && !Array.isArray(v)) {
                    rows.push(...flattenApiObject(v, path));
                } else {
                    rows.push({
                        path,
                        label: humanizeApiKey(path),
                        value: formatScalarForApi(v)
                    });
                }
            }
            return rows;
        }

        function buildModalApiTableHtml(record) {
            if (!record || typeof record !== 'object') {
                return '<p class="modal-desc">No API record stored for this item.</p>';
            }
            const clone = JSON.parse(JSON.stringify(record));
            delete clone.description;
            const rows = flattenApiObject(clone);
            if (!rows.length) {
                return '<p class="modal-desc">No API fields to display.</p>';
            }
            return rows.map(r => `
                <div class="modal-api-row">
                    <span class="modal-api-k">${escapeHtml(r.label)}</span>
                    <span class="modal-api-v">${escapeHtml(r.value)}</span>
                </div>
            `).join('');
        }

        function getDemandClass(demand) {
            if (!demand) return '';
            const d = demand.toLowerCase();
            if (d.includes('high') || d.includes('very high')) return 'demand-high';
            if (d.includes('medium') || d.includes('decent')) return 'demand-medium';
            if (d.includes('low') || d.includes('very low') || d.includes('close to none')) return 'demand-low';
            return '';
        }

        function getDemandText(demand) {
            if (!demand) return 'Normal';
            return demand;
        }

        let db = {}; 
        let currentCategory = 'all';
        let currentPage = 1;
        const itemsPerPage = 12; 
        let filteredItems = [];

        function setCat(cat, el) {
            currentCategory = cat;
            document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            resetAndRender();
        }

        function resetAndRender() {
            currentPage = 1;
            updateData();
        }

        function updateData() {
            if (!db || Object.keys(db).length === 0) return;
            const query = document.getElementById('search').value.toLowerCase();
            filteredItems = [];
            
            for (let category in db) {
                if (currentCategory !== 'all' && category !== currentCategory) continue;
                db[category].forEach(item => {
                    if (item.name.toLowerCase().includes(query)) {
                        filteredItems.push({...item, cat: category});
                    }
                });
            }
            
            filteredItems.sort((a, b) => (b.cash_value || 0) - (a.cash_value || 0));
            render();
        }

        function render() {
            const grid = document.getElementById('grid');
            const startIndex = (currentPage - 1) * itemsPerPage;
            const paginatedItems = filteredItems.slice(startIndex, startIndex + itemsPerPage);

            if (paginatedItems.length === 0) {
                grid.innerHTML = `<div class="grid-empty no-results"><p class="no-results-text">No items found matching your search.</p></div>`;
            } else {
                grid.innerHTML = paginatedItems.map((i, idx) => {
                    const trend = (i.trend || 'stable').toLowerCase();
                    const cleanVal = (i.cash_value || 0).toLocaleString();
                    const dupedVal = (i.duped_value || 0).toLocaleString();
                    const imgSrc = (i.image && String(i.image).trim()) ? i.image : ITEM_IMG_PLACEHOLDER;
                    const demandClass = getDemandClass(i.demand);
                    const demandText = getDemandText(i.demand);
                    const originalPrice = i.original_price && i.original_price !== 'N/A' ? i.original_price : null;
                    
                    return `
                    <div class="item-card" onclick="openModal(${startIndex + idx})">
                        <div class="img-container">
                            <div class="trend-badge trend-${trend}">${trend}</div>
                            ${demandText !== 'Normal' ? `<div class="demand-indicator ${demandClass}">${demandText}</div>` : ''}
                            <img src="${escapeAttr(imgSrc)}" class="img-large" alt="" onerror="jbValuesImgFallback(this)">
                        </div>
                        <div class="card-content">
                            <span class="item-cat">${escapeHtml(i.cat)}</span>
                            <h3>${escapeHtml(i.name)}</h3>
                            <div class="data-list">
                                <div class="data-item">
                                    <span class="d-label">Clean Value</span>
                                    <span class="d-val val-clean">$${cleanVal}</span>
                                </div>
                                <div class="data-item">
                                    <span class="d-label">Est. Duped</span>
                                    <span class="d-val val-duped">$${dupedVal}</span>
                                </div>
                                ${originalPrice ? `
                                <div class="data-item">
                                    <span class="d-label">Original</span>
                                    <span class="d-val" style="color: var(--text-dim);">${originalPrice}</span>
                                </div>` : ''}
                            </div>
                        </div>
                    </div>`;
                }).join('');
            }

            const totalPages = Math.ceil(filteredItems.length / itemsPerPage) || 1;
            document.getElementById('pageDisplay').innerText = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages;
        }

        function openModal(index) {
            const i = filteredItems[index];
            const trend = (i.trend || 'stable').toLowerCase();
            const clean = (i.cash_value || 0).toLocaleString();
            const duped = (i.duped_value || 0).toLocaleString();

            const modalImg = (i.image && String(i.image).trim()) ? i.image : ITEM_IMG_PLACEHOLDER;
            const rec = i.apiRecord;
            const descRaw = rec && rec.description ? String(rec.description).trim() : '';
            const descBlock = descRaw
                ? `<div class="modal-desc-block"><h3 class="modal-section-title">Description</h3><p class="modal-desc">${escapeHtml(descRaw)}</p></div>`
                : '';
            const apiTableInner = buildModalApiTableHtml(rec);
            const demandText = getDemandText(i.demand);
            const originalPrice = i.original_price && i.original_price !== 'N/A' ? i.original_price : null;

            document.getElementById('modalContent').innerHTML = `
                <div class="modal-left">
                    <div class="modal-img-big">
                        <img src="${escapeAttr(modalImg)}" alt="" onerror="jbValuesImgFallback(this)">
                    </div>
                </div>
                <div class="modal-right">
                    <span class="item-cat" style="font-size: 0.8rem">${escapeHtml(i.cat)}</span>
                    <h2 class="modal-title">${escapeHtml(i.name)}</h2>
                    <h3 class="modal-section-title" style="margin-top:0">Summary</h3>
                    <div class="detail-grid">
                        <div class="detail-box">
                            <span class="detail-label">Clean Value</span>
                            <span class="detail-value text-[var(--green)]">$${clean}</span>
                        </div>
                        <div class="detail-box">
                            <span class="detail-label">Duped Value</span>
                            <span class="detail-value text-[var(--orange)]">$${duped}</span>
                        </div>
                        <div class="detail-box">
                            <span class="detail-label">Trend</span>
                            <span class="detail-value uppercase trend-${trend}">${trend}</span>
                        </div>
                        <div class="detail-box">
                            <span class="detail-label">Demand</span>
                            <span class="detail-value">${escapeHtml(demandText)}</span>
                        </div>
                        ${originalPrice ? `
                        <div class="detail-box">
                            <span class="detail-label">Original Price</span>
                            <span class="detail-value">${escapeHtml(originalPrice)}</span>
                        </div>` : ''}
                    </div>
                    ${descBlock}
                    <h3 class="modal-section-title">Full API record</h3>
                    <div class="modal-api-table">${apiTableInner}</div>
                </div>`;
            document.getElementById('modalOverlay').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function changePage(step) {
            currentPage += step;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // START THE API FETCH
        window.onload = init;
    </script>
    <script src="loader.js"></script>
</body>
</html>
