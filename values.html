<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jailbreak Hub | Market Database</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #030508;
            --surface: #0a0c10;
            --card: #11141a;
            --border: rgba(255, 255, 255, 0.08);
            --accent: #0070f3;
            --green: #00ff88;
            --red: #ff4444;
            --orange: #ffa500;
            --text-main: #ffffff;
            --text-dim: #94a3b8;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg); color: var(--text-main); 
            margin: 0; padding-top: 40px;
            background-image: radial-gradient(circle at 50% -20%, #111827 0%, #030508 60%);
            min-height: 100vh;
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        
        .search-section {
            background: var(--surface); border: 1px solid var(--border);
            padding: 30px; border-radius: 24px; margin-bottom: 40px;
        }
        .search-bar {
            width: 100%; background: #000; border: 1px solid var(--border);
            padding: 18px; border-radius: 14px; color: #fff; font-size: 1.1rem;
            outline: none; margin-bottom: 20px;
        }

        .filter-row { display: flex; flex-wrap: wrap; gap: 10px; }
        .f-btn {
            padding: 10px 20px; border-radius: 10px; background: var(--card);
            border: 1px solid var(--border); color: var(--text-dim);
            font-size: 0.75rem; font-weight: 800; text-transform: uppercase; cursor: pointer;
        }
        .f-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

        .items-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px; padding-bottom: 50px;
        }

        .item-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 20px; display: flex; flex-direction: column; overflow: hidden;
            cursor: pointer; transition: 0.2s;
        }
        .item-card:hover { border-color: var(--accent); transform: translateY(-5px); }

        .img-container {
            width: 100%; height: 180px; background: #000;
            display: flex; align-items: center; justify-content: center;
            border-bottom: 1px solid var(--border); position: relative;
        }
        .img-large { width: 80%; height: 80%; object-fit: contain; }

        .trend-badge {
            position: absolute; top: 12px; right: 12px;
            padding: 4px 10px; border-radius: 6px; font-size: 0.6rem;
            font-weight: 900; text-transform: uppercase; border: 1px solid;
        }
        .trend-rising { background: rgba(0, 255, 136, 0.1); color: var(--green); border-color: var(--green); }
        .trend-stable { background: rgba(148, 163, 184, 0.1); color: var(--text-dim); border-color: var(--border); }

        .card-content { padding: 15px; }
        .item-cat { color: var(--accent); font-size: 0.6rem; font-weight: 800; text-transform: uppercase; margin-bottom: 4px; display: block;}
        .card-content h3 { margin: 0 0 10px 0; font-size: 1rem; font-weight: 800; }

        .data-list { display: flex; flex-direction: column; gap: 6px; }
        .data-item {
            display: flex; justify-content: space-between;
            padding: 8px; background: rgba(0,0,0,0.2); border-radius: 8px;
        }
        .d-label { font-size: 0.6rem; color: var(--text-dim); font-weight: 800; text-transform: uppercase; }
        .d-val { font-family: 'JetBrains Mono'; font-weight: 700; font-size: 0.85rem; }
        .val-clean { color: var(--green); }

        /* Modal Styles */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(3, 5, 8, 0.95); 
            z-index: 10000; display: none; overflow-y: auto; padding: 40px 20px;
            backdrop-filter: blur(10px);
        }
        .modal-container { max-width: 900px; margin: 40px auto; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: center; }
        .modal-close { position: fixed; top: 30px; right: 40px; font-size: 2rem; cursor: pointer; color: #fff; }
        .modal-img-big { background: #000; border: 1px solid var(--border); border-radius: 20px; padding: 20px; }
        .detail-box { background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 12px; margin-bottom: 10px; }

        .pagination { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 40px; }
        .page-btn { background: var(--surface); border: 1px solid var(--border); color: #fff; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
        .page-btn:disabled { opacity: 0.3; }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="text-4xl font-black italic uppercase mb-8">Market Database</h1>
        
        <div class="search-section">
            <input type="text" id="search" class="search-bar" placeholder="Search items..." oninput="resetAndRender()">
            <div class="filter-row" id="filters">
                <div class="f-btn active" id="btn-all" onclick="setCat('all', this)">All Items</div>
            </div>
        </div>

        <div class="items-grid" id="grid">
            <div class="col-span-full text-center py-20">
                <p class="animate-pulse text-blue-500 font-bold">CONNECTING TO JBVALUES API...</p>
            </div>
        </div>

        <div class="pagination">
            <button class="page-btn" id="prevBtn" onclick="changePage(-1)">Previous</button>
            <span id="pageDisplay">Page 1</span>
            <button class="page-btn" id="nextBtn" onclick="changePage(1)">Next</button>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></div>
        <div class="modal-container" id="modalContent"></div>
    </div>

    <script>
        // --- DATA HUB ---
        let db = {}; 
        let currentCategory = 'all';
        let currentPage = 1;
        const itemsPerPage = 12; 
        let filteredItems = [];

        // --- API FETCHER (Safari Optimized) ---
        async function init() {
            const proxy = "https://api.allorigins.win/get?url=";
            const itemsUrl = 'https://api.jbvalues.com/v1/items';
            const dataUrl = 'https://api.jbvalues.com/v1/itemdata';

            try {
                // Fetch both at once
                const [res1, res2] = await Promise.all([
                    fetch(proxy + encodeURIComponent(itemsUrl)).then(r => r.json()),
                    fetch(proxy + encodeURIComponent(dataUrl)).then(r => r.json())
                ]);

                const itemsRaw = JSON.parse(res1.contents);
                const pricesRaw = JSON.parse(res2.contents);

                buildDatabase(itemsRaw, pricesRaw);
            } catch (err) {
                console.error("API Error:", err);
                document.getElementById('grid').innerHTML = `<p class="text-red-500 text-center col-span-full">Failed to load data. Please refresh.</p>`;
            }
        }

        function buildDatabase(itemsRaw, pricesRaw) {
            db = {};
            const items = itemsRaw.items || itemsRaw.data || itemsRaw;
            const prices = pricesRaw.itemdata || pricesRaw.data || pricesRaw;

            items.forEach(item => {
                const cat = item.category || 'Uncategorized';
                if (!db[cat]) db[cat] = [];

                const p = prices[item.name] || {};
                db[cat].push({
                    name: item.name,
                    image: item.image,
                    value: p.value || 0,
                    duped: p.dupedValue || 0,
                    trend: p.trend || 'stable',
                    demand: p.demand || 'Normal'
                });
            });

            // Build Filters
            const filterRow = document.getElementById('filters');
            Object.keys(db).sort().forEach(cat => {
                const btn = document.createElement('div');
                btn.className = 'f-btn';
                btn.innerText = cat;
                btn.onclick = function() { setCat(cat, this); };
                filterRow.appendChild(btn);
            });

            updateData();
        }

        function setCat(cat, el) {
            currentCategory = cat;
            document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            resetAndRender();
        }

        function resetAndRender() {
            currentPage = 1;
            updateData();
        }

        function updateData() {
            const query = document.getElementById('search').value.toLowerCase();
            filteredItems = [];
            
            for (let cat in db) {
                if (currentCategory !== 'all' && cat !== currentCategory) continue;
                db[cat].forEach(item => {
                    if (item.name.toLowerCase().includes(query)) {
                        filteredItems.push({...item, cat: cat});
                    }
                });
            }
            render();
        }

        function render() {
            const grid = document.getElementById('grid');
            const start = (currentPage - 1) * itemsPerPage;
            const pageData = filteredItems.slice(start, start + itemsPerPage);

            grid.innerHTML = pageData.map((i, idx) => `
                <div class="item-card" onclick="openModal(${start + idx})">
                    <div class="img-container">
                        <div class="trend-badge trend-${i.trend.toLowerCase()}">${i.trend}</div>
                        <img src="${i.image}" class="img-large">
                    </div>
                    <div class="card-content">
                        <span class="item-cat">${i.cat}</span>
                        <h3>${i.name}</h3>
                        <div class="data-list">
                            <div class="data-item"><span class="d-label">Value</span><span class="d-val val-clean">$${Number(i.value).toLocaleString()}</span></div>
                        </div>
                    </div>
                </div>
            `).join('');

            const total = Math.ceil(filteredItems.length / itemsPerPage) || 1;
            document.getElementById('pageDisplay').innerText = `Page ${currentPage} of ${total}`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage >= total;
        }

        function openModal(idx) {
            const i = filteredItems[idx];
            document.getElementById('modalContent').innerHTML = `
                <div class="modal-img-big"><img src="${i.image}" style="width:100%"></div>
                <div>
                    <h2 class="text-4xl font-black mb-4">${i.name}</h2>
                    <div class="detail-box">Value: $${Number(i.value).toLocaleString()}</div>
                    <div class="detail-box">Demand: ${i.demand}</div>
                    <div class="detail-box">Trend: ${i.trend}</div>
                </div>`;
            document.getElementById('modalOverlay').style.display = 'block';
        }

        function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }

        // Kickoff
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
